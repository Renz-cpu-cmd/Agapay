name: AGAPAY CI

on:
  push:
    branches: [main, feature/day1-foundation]
  pull_request:
    branches: [main, feature/day1-foundation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend ${{ matrix.profile }} tests
    strategy:
      fail-fast: false
      matrix:
        profile: [core, ml, hybrid]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: agapay-backend
    env:
      AGAPAY_MQTT_ENABLED: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agapay-backend/requirements*.txt
      - name: Install development requirements
        run: python -m pip install -c requirements-lock.txt -r requirements-ci-${{ matrix.profile }}.txt
      - name: Install isolated broker test tools
        if: matrix.profile == 'core'
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto mosquitto-clients
      - name: Run assigned suite (isolated SQLite and synthetic fixtures)
        run: python scripts/run_test_profile.py ${{ matrix.profile }}

  forecast-contracts:
    name: Backend / web / mobile forecast contract drift
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: python -m pip install -c agapay-backend/requirements-lock.txt -r agapay-backend/requirements-ci-core.txt
      - run: python -m app.export_prediction_contracts --check
        working-directory: agapay-backend

  postgres-restore:
    name: Disposable PostgreSQL migration / restore
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agapay_ci
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: agapay_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agapay_ci -d agapay_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AGAPAY_TEST_POSTGRES_URL: postgresql+psycopg://agapay_ci:synthetic-ci-only@127.0.0.1:5432/agapay_test_ci
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: python -m pip install -c requirements-lock.txt -r requirements-ci-core.txt
        working-directory: agapay-backend
      - run: python -m pytest tests/test_postgres_restore.py -q
        working-directory: agapay-backend

  dependency-security:
    name: Dependency vulnerability checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r requirements-audit.txt --strict
        working-directory: agapay-backend
      - run: npm ci
        working-directory: agapay-web
      - run: npm audit --audit-level=high
        working-directory: agapay-web

  container-build:
    name: Build core production container
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: docker build --target core -t agapay-core:ci agapay-backend
      - run: docker run --rm --entrypoint python agapay-core:ci -c "from app.ml.water_depth import JsonDepthPredictor; from app.ml.decision_evaluation import DecisionPolicy; print('core forecast runtime imports without pandas or sklearn')"

  firmware-build:
    name: ESP32 Firmware Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install "platformio==6.2.0"
      - name: Create ignored placeholder configuration
        shell: bash
        run: |
          test -z "$(git ls-files agapay-firmware/include/secrets.h)"
          git check-ignore -q agapay-firmware/include/secrets.h
          cp agapay-firmware/include/secrets.example.h agapay-firmware/include/secrets.h
      - name: Compile and link ESP32 firmware (no upload or physical test)
        run: python -m platformio run --project-dir agapay-firmware --environment esp32doit-devkit-v1

  firmware-contract:
    name: Firmware Contract Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agapay-backend/requirements.txt
      - name: Install host validation requirements
        run: python -m pip install -r agapay-backend/requirements.txt "jsonschema>=4,<5" "platformio==6.2.0"
      - name: Resolve libraries from the existing PlatformIO configuration
        run: python -m platformio pkg install --project-dir agapay-firmware --environment esp32doit-devkit-v1
      - name: Run actual firmware with host fakes and both telemetry contracts
        run: python agapay-firmware/tests/run_host_tests.py --cxx g++

  web:
    name: Next.js Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agapay-web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ""
      NEXT_PUBLIC_GOOGLE_MAP_ID: DEMO_MAP_ID
      AGAPAY_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: agapay-web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run web contracts and component tests
        run: npm test
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build Next.js without live services or a Maps key
        run: npm run build -- --webpack
      - name: Install pinned Chromium for isolated browser workflows
        run: npx playwright install --with-deps chromium
      - name: Run forecast, outage, keyboard and both-theme accessibility browser workflow
        # On failure, surface the output tail as a public check annotation (logs need sign-in).
        run: |
          set +e
          npm run test:browser 2>&1 | tee test-browser.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error title=test:browser failed::$(tail -c 3000 test-browser.log | tr '\r\n' '  ' | sed 's/%/%25/g')"
          fi
          exit "$status"
      - name: Run incident ownership and station evidence browser workflow
        # On failure, surface the output tail as a public check annotation (logs need sign-in).
        run: |
          set +e
          npm run test:staff-workspaces 2>&1 | tee test-staff-workspaces.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error title=test:staff-workspaces failed::$(tail -c 3000 test-staff-workspaces.log | tr '\r\n' '  ' | sed 's/%/%25/g')"
          fi
          exit "$status"
      - name: Run published evidence and operations recovery browser workflow
        # On failure, surface the output tail as a public check annotation (logs need sign-in).
        run: |
          set +e
          npm run test:forecast-operations 2>&1 | tee test-forecast-operations.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error title=test:forecast-operations failed::$(tail -c 3000 test-forecast-operations.log | tr '\r\n' '  ' | sed 's/%/%25/g')"
          fi
          exit "$status"
      - name: Review independent reading states, vocabulary and narrow large-text semantics
        # On failure, surface the output tail as a public check annotation (logs need sign-in).
        run: |
          set +e
          npm run test:operational-states 2>&1 | tee test-operational-states.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error title=test:operational-states failed::$(tail -c 3000 test-operational-states.log | tr '\r\n' '  ' | sed 's/%/%25/g')"
          fi
          exit "$status"

  flutter:
    name: Flutter Analyze & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agapay-mobile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.38.7"
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze
      - name: Run unit and widget tests (no emulator or device)
        run: flutter test

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Check protected mobile release policy using synthetic archives
        run: python -m unittest discover -s tools -p test_release.py
      - name: Select runner Java 17
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - name: Compile development Android APK without production secrets
        run: flutter build apk --debug --flavor development
      - name: Verify unconfigured protected signing is rejected
        working-directory: agapay-mobile/android
        shell: bash
        run: |
          if env -u AGAPAY_KEYSTORE_PATH -u AGAPAY_KEYSTORE_PASSWORD -u AGAPAY_KEY_ALIAS -u AGAPAY_KEY_PASSWORD -u AGAPAY_UPLOAD_SIGNER_SHA256 ./gradlew :app:validateProductionReleasePolicy --console=plain > release-negative.log 2>&1; then
            cat release-negative.log
            echo "Unconfigured release unexpectedly accepted"
            exit 1
          fi
          grep -q "Protected signing environment is incomplete" release-negative.log
