name: agapay_mobile
description: "AGAPAY mobile frontend."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  cupertino_icons: ^1.0.9
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  url_launcher: ^6.3.2
  http: ^1.6.0
  geolocator: 14.0.2
  # 10.x supports this project's Android SDK 36 toolchain.
  flutter_secure_storage: ^10.3.1
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/config/
    - assets/maps/

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
