[platformio]
default_envs = esp32doit-devkit-v1

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.4.3
    knolleary/PubSubClient@^2.8
    ; SH1106 OLED pages; newest registry release (bench display test used Arduino 2.36.19).
    olikraus/U8g2@2.36.18
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DAGAPAY_LOCAL_DEVELOPMENT=1
    -DAGAPAY_OLED=1

; Explicit local cardboard-demo outputs; depth telemetry/calibration is unchanged.
[env:esp32-cardboard-demo]
extends = env:esp32doit-devkit-v1
build_flags =
    ${env:esp32doit-devkit-v1.build_flags}
    -DAGAPAY_LOCAL_BENCH_ALERTS=1

; Deliberately separate protected configuration; default demo secrets are ignored.
[env:esp32-production]
extends = env:esp32doit-devkit-v1
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DAGAPAY_RELEASE_BUILD=1
    -DAGAPAY_LOCAL_DEVELOPMENT=0
    -DAGAPAY_LOCAL_BENCH_ALERTS=0
